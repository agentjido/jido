- id: bundled-heartbeat-boundary
  date: 2026-10-19
  decision: Give timer configuration, runtime ownership, and periodic Signal production to jido.plugin.heartbeat.
  driver: These rules are bundled Heartbeat product behavior, not generic Plugin SDK behavior.
  approved_by: Approved Jido V3 Covenant component map

- id: heartbeat-consumer-boundary
  date: 2026-10-19
  decision: Keep generic Plugin normalization, AgentServer mailbox processing, Agent evaluation, and receiving Agent work outside jido.plugin.heartbeat.
  driver: The Heartbeat runtime sends a Signal through the public AgentServer boundary and does not control the consumer.
  approved_by: Approved Jido V3 Covenant component map

- id: heartbeat-mutation-profile
  date: 2026-10-19
  decision: Mutate Jido.Plugin.Heartbeat, Jido.Plugin.Heartbeat.Runtime, and Jido.Plugin.Heartbeat.Signal.Tick only.
  driver: These modules contain all Heartbeat-specific configuration and runtime decisions.
  approved_by: User-requested component hardening pass
