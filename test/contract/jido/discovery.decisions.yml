- id: discovery-component-boundary
  date: 2026-10-20
  decision: Use jido.discovery for the read-only Action catalog, its scan sources, diagnostics, indexes, and queries.
  driver: Catalog inventory is separate from Action execution, Agent route discovery, and product permission policy.
  approved_by: Approved Jido V3 Covenant component map

- id: discovery-test-ownership
  date: 2026-10-20
  decision: Move the complete Jido.Discovery suite to test/contract/jido/discovery and keep Jido.Agent.DSL.Discovery with jido.agent.
  driver: The two modules use the word discovery for different values and must not share one contract owner.
  approved_by: Component hardening pass

- id: discovery-mutation-profile
  date: 2026-10-20
  decision: Mutate only Jido.Discovery in this component profile.
  driver: The service owns its catalog behavior in one production module and calls lower-level Action and Instruction contracts through public boundaries.
  approved_by: Component hardening pass

- id: activate-discovery-component
  date: 2026-10-20
  decision: Activate jido.discovery with 5 obligations, 7 focused tests, and one survivor ledger with no unclassified mutant.
  driver: The focused contract owns the complete read-only Action inventory boundary and excludes Agent route discovery and permission policy.
  approved_by: Component hardening pass

- id: discovery-full-mutation-check
  date: 2026-10-20
  decision: Accept the full 128-mutant profile with 126 killed, 2 classified logging-only survivors, no invalid mutation, and no timeout at a 10000 millisecond per-test limit.
  driver: Every behavior-changing mutant is killed. The larger limit permits the supported default scan of all loaded applications under mutation worker load.
  approved_by: Component hardening pass

- id: remove-duplicate-discovery-guards
  date: 2026-10-20
  decision: Remove duplicate lookup type guards, Instruction result checks, Base64 padding configuration, and defensive slug-collision validation.
  driver: Public map lookup already returns nil for absent keys, Action behavior admission makes the Instruction checks redundant, padding cannot affect the retained prefix, and hash-collision policy is not part of the inventory contract.
  approved_by: Component hardening pass
