- id: signal-action-component-boundary
  date: 2026-10-20
  decision: Use jido.signal_action for the combined Action and Signal declaration, input Signal construction, and correlated output Signal construction.
  driver: Jido owns this integration value, while jido_action and jido_signal own their execution, routing, serialization, and transport internals.
  approved_by: Approved Jido V3 Covenant component map

- id: signal-action-test-ownership
  date: 2026-10-20
  decision: Move the core SignalAction suite to test/contract/jido/signal_action. Keep Agent route lowering with Agent authoring tests and live commit behavior with AgentServer integration tests.
  driver: One contract test must not claim Action execution, Agent route evaluation, or AgentServer effect timing.
  approved_by: Component hardening pass

- id: signal-action-mutation-profile
  date: 2026-10-20
  decision: Mutate only Jido.SignalAction in this component profile.
  driver: Agent DSL macros already belong to jido.agent, and the Action and Signal packages own their lower-level behavior.
  approved_by: Component hardening pass

- id: activate-signal-action-component
  date: 2026-10-20
  decision: Activate jido.signal_action with 7 obligations, 10 focused tests, and one survivor ledger with no unclassified mutant.
  driver: The focused contract now owns the complete Jido integration boundary between Action declarations and Signal values.
  approved_by: Component hardening pass

- id: signal-action-full-mutation-check
  date: 2026-10-20
  decision: Accept the full 112-mutant profile with 78 killed, 3 classified survivors, 31 invalid compile-time mutations, and no timeout.
  driver: Every behavior-changing valid mutant is killed, and the only survivors change human-readable error prose that the contract does not fix.
  approved_by: Component hardening pass
