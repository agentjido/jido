exclusions:
  - path: examples/00_graph_first
    reason: The numbered live-provider lesson is opt-in. U15 owns offline AI examples, and U19 owns live-provider proof.
  - path: examples/durable/11_durable/11_03_vm_recovery/support
    reason: The DETS Store is support for the VM recovery lesson and is not a standalone lesson.
  - path: examples/durable/11_durable/11_07_external_uncertainty/support
    reason: The memory provider is support for the external uncertainty lesson and is not a standalone lesson.
  - path: examples/persistence/10_persistence/10_07_recoverable_delivery/support
    reason: The memory sink is support for the recoverable delivery lesson and is not a standalone lesson.
  - path: examples/plugin/08_applications/08_04_approval_workflow/support
    reason: The adapters are support for the approval workflow lesson and are not a standalone lesson.
  - path: examples/plugin/09_plugins/support
    reason: The crypto helper is shared by numbered Plugin lessons and is not a standalone lesson.
  - path: examples/runtime/04_runtime/support
    reason: Shared observation support is loaded by numbered runtime lessons and is not a standalone lesson.
  - path: examples/runtime/05_multi_agent/support
    reason: The shared Worker is loaded by numbered multi-Agent lessons and is not a standalone lesson.
  - path: examples/runtime/support
    reason: The shared lifecycle Action is loaded by numbered runtime lessons and is not a standalone lesson.
  - path: examples/topology/07_topology/support
    reason: The shared Cell is loaded by numbered topology lessons and is not a standalone lesson.
  - path: test/examples/durable/11_durable/11_03_vm_recovery/dets_store_test.exs
    reason: The adapter test is auxiliary proof for the VM recovery lesson, which owns the catalog test path.
  - path: test/examples/persistence/10_persistence/10_01_persistent_agent/checkpoint_identity_test.exs
    reason: The identity test is auxiliary proof for the persistent Agent lesson, which owns the catalog test path.
