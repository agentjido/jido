  - id: flow/compilation/compiled_program
    category: flow
    readme: examples/flow/compilation/compiled_program/README.md
    source: examples/flow/compilation/compiled_program/compiled_program.ex
    test: test/examples/flow/compilation/compiled_program_test.exs
