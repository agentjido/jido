version: 1
id_pattern: '^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)+$'
categories:
  - id: flow
    source_root: examples/flow
    test_root: test/examples/flow
  - id: agent
    source_root: examples/agent
    test_root: test/examples/agent
  - id: runtime
    source_root: examples/runtime
    test_root: test/examples/runtime
  - id: topology
    source_root: examples/topology
    test_root: test/examples/topology
  - id: plugin
    source_root: examples/plugin
    test_root: test/examples/plugin
  - id: persistence
    source_root: examples/persistence
    test_root: test/examples/persistence
  - id: durable
    source_root: examples/durable
    test_root: test/examples/durable
  - id: ai
    source_root: examples/ai
    test_root: test/examples/ai
index_readmes:
  - examples/flow/compilation/README.md
examples:
  - id: flow/compilation/single_step
    category: flow
    readme: examples/flow/compilation/single_step/README.md
    source: examples/flow/compilation/single_step/single_step.ex
    test: test/examples/flow/compilation/single_step_test.exs
  - id: flow/compilation/dependency_graph
    category: flow
    readme: examples/flow/compilation/dependency_graph/README.md
