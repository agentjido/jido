    test: test/examples/flow/compilation/dependency_graph_test.exs
  - id: flow/compilation/dsl_flow
    category: flow
    readme: examples/flow/compilation/dsl_flow/README.md
    source: examples/flow/compilation/dsl_flow/dsl_flow.ex
    test: test/examples/flow/compilation/dsl_flow_test.exs
  - id: flow/compilation/stored_json
    category: flow
    readme: examples/flow/compilation/stored_json/README.md
    source: examples/flow/compilation/stored_json/stored_json.ex
    test: test/examples/flow/compilation/stored_json_test.exs
  - id: flow/compilation/authoring_equivalence
    category: flow
    readme: examples/flow/compilation/authoring_equivalence/README.md
    source: examples/flow/compilation/authoring_equivalence/authoring_equivalence.ex
    test: test/examples/flow/compilation/authoring_equivalence_test.exs
  - id: flow/compilation/validation
