- id: persistence-component-boundary
  date: 2026-10-20
  decision: Use jido.persistence for portable Agent records, adapter configuration, storage operations, snapshots, revisions, tombstones, and Plugin-owned state conversion.
  driver: These rules are data and storage contracts. They do not depend on one live AgentServer activation.
  approved_by: Approved Jido V3 Covenant component map

- id: persistence-test-ownership
  date: 2026-10-20
  decision: Move shared persistence contract tests to test/contract/jido.persistence. Keep one-backend tests in test/jido/persistence. Keep live recovery and durable commit tests in the AgentServer durable components.
  driver: A shared contract must not claim backend implementation details or runtime recovery policy.
  approved_by: Component hardening pass

- id: persistence-mutation-profile
  date: 2026-10-20
  decision: Mutate the shared persistence coordinator, adapter boundary, record, snapshot, checkpoint, identity, source, Plugin conversion, and Store modules. Do not mutate each backend in this component profile.
  driver: The shared modules own portable behavior. Backend modules have separate implementation and service profiles, while conformance tests prove the common adapter contract.
  approved_by: Component hardening pass

- id: remove-duplicate-revision-zero-activation-test
  date: 2026-10-20
  decision: Remove the persistence-side activation test for revision-zero creation before readiness. Keep the stronger jido.agent_server.durable contract test as its owner.
  driver: AgentServer publication order is not a persistence record rule, and the active durable component already protects it.
  approved_by: Component hardening pass

- id: remove-unused-definition-preparation
  date: 2026-10-20
  decision: Remove the hidden replace_agent and prepare_agent APIs and their private helper chain.
  driver: No production module, guide, example, or sibling V3 package in this workspace calls them. The functions formed a second unused definition-change model beside the active AgentServer upgrade path.
  approved_by: Component hardening pass

- id: activate-persistence-component
  date: 2026-10-22
  decision: Activate jido.persistence with 15 obligations, 82 focused tests, and one survivor ledger with no unclassified mutant.
  driver: The contract tests now own the complete shared persistence boundary, and the mutation profile has no unexplained survivor.
  approved_by: Component hardening pass

- id: persistence-full-mutation-check
  date: 2026-10-22
  decision: Accept the full 831-mutant profile with 743 killed, 37 classified survivors, 51 invalid compile-time mutations, and no timeout.
  driver: Every valid survivor is classified at its current source location, and every behavior-changing valid mutant is killed by the 82 focused tests.
  approved_by: Component hardening pass

- id: checkpoint-callback-mutation-ownership
  date: 2026-10-20
  decision: Add Jido.Agent.Callback to this mutation profile.
  driver: The module is used only to contain Agent checkpoint and restore callback faults in persistence snapshots.
  approved_by: Final hardening audit

- id: persistence-v3-instance-profile
  date: 2026-11-13
  decision: Use one Store and one fixed codec for each durable Jido instance and namespace. Term is the default codec and tagged JSON is opt-in.
  driver: Agent, Flow, and wake recovery need one storage authority, while developers need an inspectable format without semantic adapters.
  approved_by: User-confirmed persistence design review

- id: persistence-v3-clean-format-break
  date: 2026-11-13
  decision: Use V3 manifest, Agent, execution, and wake records with no V2 runtime, migration, or inspection compatibility path.
  driver: The old formats are unreleased, and one exact namespace manifest gives a smaller and safer startup contract.
  approved_by: User-confirmed persistence design review

- id: persistence-v3-durability-order
  date: 2026-11-13
  decision: Prepare Flow and timed wake records before the matching Agent record. The Agent record is the durable commit point.
  driver: A single-key Store cannot atomically write all record families, so auxiliary records can be safe orphans but a committed timed wait cannot miss its wake data.
  approved_by: User-confirmed persistence design review

- id: persistence-v3-store-hardening
  date: 2026-11-13
  decision: Require option validation, get, compare-and-swap, and delete. Keep paged scan optional. Forbid Redis TTL and reject Ecto writes inside an outer transaction.
  driver: Durability needs explicit cleanup and confirmed write boundaries. Runtime recovery must not depend on key enumeration.
  approved_by: User-confirmed persistence design review

- id: persistence-v3-wake-generations
  date: 2026-11-13
  decision: Store one monotonically increasing generation in each wake shard and its active-index entry. Cleanup can remove only the generation that it made empty.
  driver: A cleanup on one node must not remove index membership for a newer wake that another node wrote to the same shard.
  approved_by: Persistence durability verification
