- id: agent-server2-durable-boundary
  date: 2026-10-16
  decision: Keep all runtime changes in agent_server2.ex. Persistence is opt-in with a stable Jido instance namespace and explicit create or restore policy. Reuse existing Persistence record, compare-and-swap, Agent checkpoint, and Plugin conversion APIs. Bound startup storage and required commit writes in owned tasks. Confirm durable write before local publication and success. Hold turns during save; caller timeout does not cancel it. Failed or unknown required writes close the activation. Reload durable authority on every worker recovery before Plugin Init, and recreate resources through existing callbacks. No implicit migration, replay, relationship restore, or writer lease is added.
