- id: agent-server2-local-controls
  date: 2026-10-16
  decision: Keep B3 controls in agent_server2.ex. Quiesce rejects parked requests and waits for execution cleanup and post-commit work. Cancel only pre-commit work. Use finite control budgets and explicit resume. Keep attached owners and admission in activation metadata across worker replacement. Disable idle timeout by default, with explicit stop or persistent hibernate policy. Hibernate saves the current revision and confirms root exit. Known no-write failure restores prior admission; conflict or unknown write keeps the live Agent blocked, including recovery during save. No child-family quiesce or distributed ownership policy is added.
  driver: Complete B3 H1 and items 41-42 with scoped tests, selected mutations, demo, and memory checks. Keep the public authoring DSL unchanged and AgentServer intact. No commits.
  approved_by: User request in this chat
