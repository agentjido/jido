- id: bundled-sensor-manager-boundary
  date: 2026-10-19
  decision: Give desired sensor Directives, desired state reduction, reconciliation, retry ownership, and stale-work fencing to jido.plugin.sensor_manager.
  driver: These rules are bundled SensorManager product behavior, not generic Plugin SDK behavior.
  approved_by: Approved Jido V3 Covenant component map

- id: sensor-manager-consumer-boundary
  date: 2026-10-19
  decision: Keep sensor implementation behavior, generic Plugin callback timing, AgentServer commit atomicity, and receiving Agent work outside jido.plugin.sensor_manager.
  driver: SensorManager owns process alignment after a commit but does not define the sensor or its consumer.
  approved_by: Approved Jido V3 Covenant component map

- id: sensor-manager-mutation-profile
  date: 2026-10-19
  decision: Mutate only the Jido.Plugin.SensorManager root, runtime, and controller modules.
  driver: These modules contain the bundled Plugin's desired-state, reconciliation, retry, and fencing decisions.
  approved_by: User-requested component hardening pass

- id: sensor-manager-public-api
  date: 2026-10-22
  decision: Expose only the SensorManager constructors and option type, Start and Stop Directive validation, and the sensor-facing Init value. Keep runtime and controller modules internal, keep Agent state and Plugin callbacks on the root, and add no custom DSL.
  driver: Applications need to declare desired sensors and implement sensor children, but runtime reconciliation details are not an application contract.
  approved_by: User-requested component review
