module_ownership:
  covenant_records: test/contracts/**/*.obligations.md
  overrides:
    - module: Jido.Persistence
      component: jido.persistence
      reason: The persistence facade belongs to the persistence component, not its durable AgentServer consumer.
    - module: Jido.Instruction.Config
      component: jido_action.action
      reason: Static instruction configuration is owned by Action compilation; Inline Action is a consumer.
    - module: Jido.AgentServer.Lifecycle
      component: jido.agent_server
      reason: The lifecycle coordinator is the core AgentServer owner; durable components exercise focused paths through it.
