exclusions:
- path: examples/00_quick_start/00_03_live_react
  reason: The numbered live-provider lesson is opt-in. U15 owns offline AI examples,
    and U19 owns live-provider proof.
- path: examples/15_ai_basics/support
  reason: The arithmetic tools are shared by numbered offline AI lessons and are not
    a standalone lesson.
- path: examples/14_durable_agents/support
  reason: Durable test probes and peer controls are shared by numbered durable Agent
    lessons and are not standalone lessons.
- path: examples/14_durable_agents/14_03_vm_recovery/support
  reason: The DETS Store is support for the VM recovery lesson and is not a standalone
    lesson.
- path: examples/14_durable_agents/14_07_external_uncertainty/support
  reason: The memory provider is support for the external uncertainty lesson and is
    not a standalone lesson.
- path: examples/13_persistence/13_07_recoverable_delivery/support
  reason: The memory sink is support for the recoverable delivery lesson and is not
    a standalone lesson.
- path: examples/12_plugin_applications/12_04_approval_workflow/support
  reason: The adapters are support for the approval workflow lesson and are not a
    standalone lesson.
- path: examples/11_plugins/support
  reason: The crypto helper is shared by numbered Plugin lessons and is not a standalone
    lesson.
- path: examples/08_runtime/support
  reason: Shared observation and state support is loaded by numbered runtime lessons
    and is not a standalone lesson.
- path: examples/09_multi_agent/support
  reason: The shared Worker is loaded by numbered multi-Agent lessons and is not a
    standalone lesson.
- path: examples/10_topologies/support
  reason: The shared Cell is loaded by numbered topology lessons and is not a standalone
    lesson.
- path: examples/14_durable_agents/14_03_vm_recovery/dets_store_test.exs
  reason: The adapter test is auxiliary proof for the VM recovery lesson, which owns
    the catalog test path.
- path: examples/13_persistence/13_01_persistent_agent/checkpoint_identity_test.exs
  reason: The identity test is auxiliary proof for the persistent Agent lesson, which
    owns the catalog test path.
