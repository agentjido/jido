- id: topology-contract-scope
  date: 2026-10-15
  decision: Protect Topology authoring, its shared Agent host, pure planning, and static documents. Keep runtime activation, AgentServer, Controller, persistence, and dispatch outside the component.
  driver: Add guards before Agent and Topology compiler consolidation while the public DSL remains unchanged.
