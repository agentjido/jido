name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v5
    secrets: inherit
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      credo_command: mix credo --strict --only warning
      docs_command: mix docs --no-open -f html --warnings-as-errors
      # Keep application scenarios in CI; run the other examples separately.
      test_command: mix test test/jido test/jido_test test/examples/08_applications --include example --include flaky --seed 0
      # The V3 integration branch retains an unreleased Git dependency. Check
      # Hex publication when changes reach main, including its merge queue.
      validate_hex_package: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main' }}
